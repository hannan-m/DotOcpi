name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        dotnet: ['8.0.x', '10.0.x']
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -warnaserror

      - name: Test (net8.0)
        if: startsWith(matrix.dotnet, '8')
        run: dotnet test --no-build --framework net8.0 --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Test (net10.0)
        if: startsWith(matrix.dotnet, '10')
        run: dotnet test --no-build --framework net10.0 --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && startsWith(matrix.dotnet, '8')
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/**/coverage.cobertura.xml

  format-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install CSharpier
        run: dotnet tool install csharpier -g

      - name: Check formatting
        run: csharpier check src/ tests/

  aot-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build with trimming warnings
        run: dotnet build src/DotOcpi/DotOcpi.csproj --no-restore -warnaserror /p:IsTrimmable=true /p:EnableTrimAnalyzer=true
