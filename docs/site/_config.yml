title: DotOcpi
description: Open-source OCPI .NET library for the eMSP side
baseurl: /DotOcpi
url: https://hannan-m.github.io

remote_theme: just-the-docs/just-the-docs@v0.10.0

color_scheme: dark

permalink: pretty

exclude:
  - Gemfile
  - Gemfile.lock
  - .github-pages-deploy.md

search_enabled: true
search.heading_level: 3

heading_anchors: true

nav_external_links:
  - title: GitHub
    url: https://github.com/hannan-m/DotOcpi
  - title: NuGet
    url: https://www.nuget.org/packages?q=DotOcpi

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: yellow

back_to_top: true
back_to_top_text: "Back to top"

footer_content: "DotOcpi is released under the <a href=\"https://github.com/hannan-m/DotOcpi/blob/main/LICENSE\">MIT License</a>."

ga_tracking: null

mermaid:
  version: "10.9.0"

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false
